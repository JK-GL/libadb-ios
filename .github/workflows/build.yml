name: Build libadb for iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Compile libadb.a
    runs-on: macos-14
    timeout-minutes: 240

    env:
      CPLUS_INCLUDE_PATH: '/opt/homebrew/include'

    steps:
      - name: 检出 adb-mobile 源码
        uses: actions/checkout@v4
        with:
          repository: wsvn53/adb-mobile
          submodules: recursive
          fetch-depth: 1
          path: src

      - name: 检出构建脚本
        uses: actions/checkout@v4
        with:
          path: builder

      - name: 环境信息
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          cmake --version | head -1

      - name: 安装 protobuf 28.3（构建硬依赖）
        run: |
          set -e
          # 下载官方 28.3 预编译 protoc，避免 Homebrew 装到 36.x
          ARCH=$(uname -m)
          if [ "$ARCH" = "arm64" ]; then
            PB_ZIP=protoc-28.3-osx-aarch_64.zip
          else
            PB_ZIP=protoc-28.3-osx-x86_64.zip
          fi
          curl -fsSL -o /tmp/protoc.zip \
            "https://github.com/protocolbuffers/protobuf/releases/download/v28.3/${PB_ZIP}"
          mkdir -p /tmp/protoc28
          unzip -q /tmp/protoc.zip -d /tmp/protoc28
          echo "/tmp/protoc28/bin" >> $GITHUB_PATH
          /tmp/protoc28/bin/protoc --version

      - name: 安装其余依赖
        run: |
          brew install googletest
          ls /opt/homebrew/include/gtest/gtest_prod.h

      - name: 钉版本 + 编译 protobuf
        working-directory: src
        run: |
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage pin
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage protoc
          # patchpb 必须先跑：给 external/protobuf 拉 tags，否则 checkout v28.3 必失败
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage patchpb
          set -o pipefail
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage protobuf

      - name: 打补丁
        working-directory: src
        run: python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage patch

      - name: 编译压缩库（brotli / lz4 / zstd）
        working-directory: src
        run: |
          set -o pipefail
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage compress

      - name: 编译 libadb
        id: adb
        continue-on-error: true
        working-directory: src
        run: |
          set -o pipefail
          python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage adb 2>&1 | tee /tmp/build.log

      - name: 汇总错误
        if: always()
        run: |
          echo "===== 错误行 ====="
          grep -nE "error:|fatal error|❌|\[fail\]|Error [0-9]" /tmp/build.log | head -40 || echo "无"
          echo "===== 末尾 50 行 ====="
          tail -n 50 /tmp/build.log || true

      - name: 合并并校验产物
        id: collect
        if: steps.adb.outcome == 'success'
        working-directory: src
        run: python3 ../builder/scripts/build_libadb.py --root "$PWD" --stage collect

      - name: 上传产物
        if: steps.collect.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: libadb-ios-arm64
          path: src/dist/
          retention-days: 90

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: /tmp/build.log
          retention-days: 30
